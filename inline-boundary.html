<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"><head><style>
  body { margin: 8px; font: 16px sans-serif; }
  table { border-collapse: collapse; width: 1px; }
  td { border: 1px solid #c00; padding: 2px 4px; vertical-align: top; }
</style></head><body>
<table><tr>
  <td>aaabbb</td>
  <td>aaa<span>bbb</span></td>
  <td>aaa<b>bbb</b></td>
  <td>aaa<span style="color: #06c">bbb</span></td>
  <td>aaa&#160;bbb</td>
  <td>aaa&#160;<span>bbb</span></td>
</tr></table>
</body></html>
